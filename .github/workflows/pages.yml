# GitHub Pages: po kiekvieno įkėlimo į main (ir paspaudus „Atnaujinti svetainę“ administravimo skydelyje) surenka
# parduotuvę (node tools/build-site.mjs → site/, katalogas – iš Supabase) ir paskelbia adresu https://<vartotojas>.github.io/vaidore/.
# Įjungti: Settings → Pages → Source: „GitHub Actions“. Duomenų bazė, paskyros ir apmokėjimas veikia per Supabase,
# todėl ir Pages kopijoje viskas veikia (Stripe grįžimo adresas vakomb.github.io/vaidore leidžiamas – shop.js pickSite).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Surinkti svetainę
        run: node tools/check.mjs && node tools/build-site.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/ # svetainė poaplankyje: <vartotojas>.github.io/vaidore/
          NOINDEX: "1" # peržiūros kopija – paieškos sistemos indeksuoja tik vaidore.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
