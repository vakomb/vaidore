<section class="view" id="view-home" data-view="home" aria-label="Pradžia">
  <header class="topbar">
    <span class="logo" data-logo></span>
    <button class="roundBtn" data-info aria-label="Informacija"><span data-glyph="info"></span></button>
  </header>
  <div class="viewBody">
    <p class="lede" id="homeLede"></p>
    <div id="homeHero"></div>
    <div class="tiles" id="homeTiles"></div>
    <div class="group homeHelp" id="homeHelp"></div>
    <section class="block">
      <div class="blockHead">
        <h2>Populiariausi</h2>
        <button class="linkBtn" data-go-shop="rank">Visi</button>
      </div>
      <div class="rail" id="homePopular"></div>
    </section>
    <section class="block">
      <div class="blockHead"><h2>Pagal nuotaiką</h2></div>
      <div class="moods" id="homeMoods"></div>
    </section>
    <section class="block">
      <div class="blockHead">
        <h2>Naujienos</h2>
        <button class="linkBtn" data-go-shop="new">Visos</button>
      </div>
      <div class="rail" id="homeNew"></div>
    </section>
    <section class="block" id="homeReviews" hidden></section>
    <div class="trust" id="homeTrust"></div>
    <section class="story" id="homeStory" aria-labelledby="storyTitle"></section>
    <footer class="foot" id="homeFoot"></footer>
  </div>
</section>
