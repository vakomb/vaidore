<!-- title: Ačiū už užsakymą -->
<section class="pgCard pgDone">
  <div class="pgCheck" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9.5" /></svg></div>
  <h1>Ačiū už užsakymą!</h1>
  <p>Apmokėjimas gautas. Patvirtinimą ir kvitą išsiuntėme el. paštu, o kai siunta iškeliaus – atsiųsime sekimo nuorodą.</p>
  <p class="pgMuted" id="orderRef"></p>
  <a class="pgBtn" href="/">Grįžti į parduotuvę</a>
</section>
<script>
  // Užsakymas apmokėtas – išvalome krepšelį (raktai – src/scripts/app/05-state.js)
  try {
    localStorage.removeItem("vaidore_cart_v1");
    localStorage.removeItem("vaidore_pending_v1");
    var s = new URLSearchParams(location.search).get("s");
    if (s) document.getElementById("orderRef").textContent = "Užsakymo nr. " + s.slice(-8).toUpperCase();
  } catch (e) {}
</script>
